<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>URL History</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="history-container">

        <h1>📊 URL History</h1>
        <input
    type="text"
    id="searchInput"
    class="search-box"
    placeholder="🔎 Search URLs..."
    onkeyup="searchURLs()">

        <a href="/" class="back-button">
            ← Back to URL Shortener
        </a>

        {% if urls %}

       <table id="urlTable">

            <thead>

                <tr>
                    <th>Original URL</th>
                    <th>Short URL</th>
                    <th>Clicks</th>
                </tr>

            </thead>

            <tbody>

                {% for url in urls %}

                <tr>

                    <td>
                        {{ url[0] }}
                    </td>

                    <td>

    <a href="{{ request.host_url }}{{ url[1] }}"
       target="_blank"
       class="short-link">
        {{ request.host_url }}{{ url[1] }}
    </a>

    <button
        class="copy-button"
        onclick="copyURL('{{ request.host_url }}{{ url[1] }}')">
        📋 Copy
    </button>

</td>

                    <td>

    {{ url[2] }}

    <form
        action="/delete/{{ url[1] }}"
        method="POST"
        style="display:inline;">

        <button
            type="submit"
            class="delete-button"
            onclick="return confirm('Are you sure you want to delete this URL?');">

            🗑️ Delete

        </button>

    </form>

</td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

        {% else %}

        <p>No URLs have been shortened yet.</p>

        {% endif %}

    </div>
<script>

function copyURL(url) {

    navigator.clipboard.writeText(url)
        .then(function() {

            alert("Short URL copied!");

        })
        .catch(function() {

            alert("Unable to copy URL.");

        });

}

</script>


<script>

function searchURLs() {

    let input = document.getElementById("searchInput");

    let filter = input.value.toLowerCase();

    let table = document.getElementById("urlTable");

    let rows = table.getElementsByTagName("tr");

    for (let i = 1; i < rows.length; i++) {

        let text = rows[i].textContent.toLowerCase();

        if (text.includes(filter)) {

            rows[i].style.display = "";

        } else {

            rows[i].style.display = "none";

        }

    }

}

</script>
</body>

</html>
